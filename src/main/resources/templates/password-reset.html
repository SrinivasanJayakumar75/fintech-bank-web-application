<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Welcome</title>
        <style>
            body {font-family: Arial, sans-serif; background: #f6f9fc; margin: 0; padding: 0;}
            .container {max-width: 600px; margin: 30px auto; background: #ffffff; border-radius:8px;
            padding: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center;}
            h2{color: #1565c0;}
            p{color: #333;}
            .footer{margin-top: 30px; font-size: 13px; color: #555;}

            a.button{
                display: inline-block; margin-top: 20px; padding: 12px 20px;
                background: #1565c0; color: #fff; text-decoration: none;
                border-radius: 6px; font-weight: bold;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h2>Hello, <span th:text="${name}">User</span>!</h2>
            <p>Password reset link <b>Fintech Bank</b>.</p>
            <a th:href="${resetLink}" class="button">Reset Password</a>
            <p>Please click on the button to reset password</p>
            <div class="footer">
                2026 Fintech Bank | Your Trusted Partner.
            </div>

        </div>
    </body>
</html>
