<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Welcome</title>
        <style>
            body {font-family: Arial, sans-serif; background: #f6f9fc; margin: 0; padding: 0;}
            .container {max-width: 600px; margin: 30px auto; background: #ffffff; border-radius:8px;
            padding: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center;}
            h2{color: #1565c0;}
            p{color: #333;}
            .footer{margin-top: 30px; font-size: 13px; color: #555;}
        </style>
    </head>
    <body>
        <div class="container">

            <h2>Debit Alert</h2>
            <p>Dear <b th:text="${name}">Customer</b>,</p>
            <div class="alert">
                <p>Your account has been debited with <b>$<span th:text="${amount}"></span></b></p>
                <p>Account Number: <b th:text="${accountNumber}"></b></p>
                <p>Date: <span th:text="${date}"></span></p>
                <p>Available Balance: <b>$<span th:text="${balance}"></span></b></p>
            </div>
            <div class="footer">
                2026 Fintech Bank | Your Trusted Partner.
            </div>

        </div>
    </body>
</html>
